<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='1' y='1' width='26' height='26' rx='7' fill='%232F5BEA'/%3E%3Cpath d='M8 19v-6l6-5 6 5v6h-4v-4h-4v4z' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
<style>:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --line:#E3E6EB; --line2:#EEF0F3; --ink:#141821; --muted:#555E6C;
  --accent:#2F5BEA; --accent-hover:#2449C4; --accent-soft:#E8EEFC; --track:#DCE4FB;
  --side:#121826; --side-ink:#C9D1DD; --side-muted:#8F9AAD; --side-on:#26314A;
  --info-bg:#E8EEFC; --info-fg:#1D4ED8; --warn-bg:#FBF1DA; --warn-fg:#8A5A00; --bad-bg:#FDECE4; --bad-fg:#B4380B; --neu-bg:#EEF0F3; --neu-fg:#4B5563;
  --input:#CDD2DA;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:30px;font-weight:650}
h2{font-size:18px;font-weight:650}
h3{font-size:15px;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.strong{font-weight:600}
.right{text-align:right}
.nowrap{white-space:nowrap}

.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 220px;background:var(--side);color:var(--side-ink);padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:18px;color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:4px}
.nav button{flex:1 1 180px;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);font-weight:500;text-align:left}
.nav button:hover{background:#1C2434}
.nav button[aria-current=page]{background:var(--side-on);color:#fff;font-weight:600}
.badge{margin-left:auto;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#F5C451;color:#121826}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;font-size:13px}
.side-foot .label{font-size:12px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.06em}
.side-foot .note{font-size:12px;color:var(--side-muted)}
.side-btn{align-self:flex-start;min-height:44px;padding:0 12px;border:1px solid #3A4458;border-radius:8px;background:transparent;color:var(--side-ink);font-weight:600}
.side-btn:hover{background:#1C2434}

.main{flex:999 1 560px;min-width:0;padding:20px clamp(16px,3vw,40px) 56px;display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.topbar .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.monthpick{display:flex;align-items:center;gap:4px}
.monthpick .label{min-width:140px;text-align:center;font-weight:600}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--input);border-radius:8px;background:#fff}
.icon-btn:hover{background:#F7F8FA}

.page-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.page-head .eyebrow{font-size:13px;color:var(--muted);margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{min-height:44px;padding:0 16px;border:1px solid var(--input);border-radius:8px;background:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){background:#F7F8FA}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.danger{color:var(--bad-fg);border-color:#F0C4B3}
.btn.link{border:0;background:none;color:var(--accent);padding:0 8px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.textlink{border:0;background:none;padding:0;min-height:44px;font-weight:600;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--input);text-underline-offset:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card.pad{padding:16px 20px 20px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;min-height:48px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.grow2{flex:2 1 560px;min-width:0}
.grow1{flex:1 1 320px;min-width:0}
.grow3{flex:3 1 620px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:16px}
.kpi{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-align:left}
.kpi:hover{border-color:#C9D0DB}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-size:27px;font-weight:650}
.kpi .d{font-size:12px;color:var(--muted)}
.meter{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:4px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary>div{background:#fff;padding:14px 18px}
.summary .v{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-size:21px;font-weight:650}

.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--input);background:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.tab[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .n{font-size:12px;opacity:.85}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.t-info{background:var(--info-bg);color:var(--info-fg)}
.t-warn{background:var(--warn-bg);color:var(--warn-fg)}
.t-bad{background:var(--bad-bg);color:var(--bad-fg)}
.t-neutral{background:var(--neu-bg);color:var(--neu-fg)}
.fg-info{color:var(--info-fg)} .fg-warn{color:var(--warn-fg)} .fg-bad{color:var(--bad-fg)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:12px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line2);vertical-align:middle}
tr.sel td{background:#F0F4FE}
tr.total td{border-top:2px solid var(--line);font-weight:700}
th.right,td.right{text-align:right}
.table-card{padding:4px 10px 8px}

.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.list>li .body{flex:1;min-width:0}
.ico{flex:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.rowbtn{width:100%;display:flex;gap:14px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line2);background:transparent;text-align:left}
.datebox{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0}
.datebox .m{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.datebox .d{font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;font-size:18px;font-weight:650;line-height:1.2}
.empty{padding:20px 0;color:var(--muted);border-top:1px solid var(--line2)}

.panel{padding:20px;display:flex;flex-direction:column;gap:16px}
.panel .eyebrow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
dl.facts{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
dl.facts dt{font-size:12px;color:var(--muted)}
dl.facts dd{margin:0;font-weight:600}
.note-box{padding:10px 12px;border-radius:8px;background:var(--bg);font-size:13px}
.dashed{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border:1px dashed var(--input);border-radius:10px;text-align:center}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select,.field textarea,.select{min-height:44px;padding:0 12px;border:1px solid var(--input);border-radius:8px;background:#fff;font-weight:400;width:100%}
.field textarea{padding:10px 12px;resize:vertical}
.field .hint{font-weight:400;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px}
.check{display:flex;gap:10px;align-items:center;min-height:40px;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent);flex:none}
fieldset{margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:4px}
legend{padding:0;margin-bottom:6px;font-size:13px;font-weight:600}

.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px;align-items:start}
.col{background:#EBEDF1;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px}
.count{font-size:12px;font-weight:700;color:var(--neu-fg);background:#fff;padding:2px 8px;border-radius:999px}
.wo{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px 14px;display:flex;flex-direction:column;gap:6px}
.wo-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

.modal-back{position:fixed;inset:0;z-index:50;background:rgba(18,24,38,.55);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.modal{width:100%;max-width:540px;background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head h2{font-size:21px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding-top:4px}
.modal-foot .left{margin-right:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;padding:10px 10px 10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.toast button{flex:none;width:36px;height:36px;border:0;border-radius:6px;background:#2A3242;color:#fff}

.welcome{max-width:760px;margin:40px auto;display:flex;flex-direction:column;gap:20px}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.choice button{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}
.choice button:hover{border-color:var(--accent)}

.checklist .item{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.checklist label{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;padding:4px 0;cursor:pointer}
.checklist input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent)}
.checklist .done .t{color:var(--muted)}

.settings-section{display:flex;flex-direction:column;gap:12px}

/* sidebar: pinned on wide screens, slide-out drawer on narrow ones */
.mobilebar{display:none}
.scrim{display:none}
@media (min-width:900px){
  .shell{flex-wrap:nowrap}
  .side{flex:0 0 240px;position:sticky;top:0;height:100vh;overflow-y:auto}
}
@media (max-width:899px){
  .shell{flex-direction:column;flex-wrap:nowrap}
  .mobilebar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30;background:var(--side);padding:8px 16px}
  .mobilebar .brand{padding:0}
  .mobilebar button{min-height:44px;padding:0 14px;border:1px solid #3A4458;border-radius:8px;background:transparent;color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:8px}
  .side{display:none}
  .side.open{display:flex;position:fixed;top:0;left:0;bottom:0;width:min(300px,85vw);z-index:45;overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .side.open .nav button{flex-basis:100%}
  .scrim.open{display:block;position:fixed;inset:0;z-index:44;background:rgba(18,24,38,.5);border:0}
  .main{flex:1 1 auto}
}

@media print{
  .side,.topbar,.actions,.tabs,.no-print,.toast,.modal-back{display:none!important}
  body,.main{background:#fff;padding:0}
  .card{border:0}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
